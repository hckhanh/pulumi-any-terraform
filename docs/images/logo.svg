<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pat-tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#2E1065"/>
    </linearGradient>
    <linearGradient id="pat-blue" x1="12" y1="16" x2="34" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="pat-violet" x1="32" y1="14" x2="54" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EDE9FE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="pat-joint" x1="26" y1="24" x2="40" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ECFEFF"/>
      <stop offset="0.4" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="pat-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#pat-tile)"/>
  <path
    d="M33 15.5 14.5 32 33 48.5"
    stroke="url(#pat-blue)"
    stroke-width="9.5"
    stroke-linejoin="miter"
    stroke-linecap="butt"
  />
  <path
    d="M31 15.5 49.5 32 31 48.5"
    stroke="url(#pat-violet)"
    stroke-width="9.5"
    stroke-linejoin="round"
    stroke-linecap="butt"
  />
  <path fill="url(#pat-joint)" filter="url(#pat-glow)" d="M32 23.2 39.4 32 32 40.8 24.6 32Z"/>
</svg>
