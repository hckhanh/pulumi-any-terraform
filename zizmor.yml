rules:
  # SHA pins live in `.github/workflows/actions.lock` (enforced by GitHub at
  # runtime for workflows managed by `gh actions-lock`). Workflow YAML keeps
  # readable tag refs, so require ref-pin here instead of hash-pin.
  unpinned-uses:
    config:
      policies:
        '*': ref-pin
  # These jobs push with the checkout credential (`git push`, autofix.ci,
  # and `changeset publish` git tags via changesets/action).
  artipacked:
    ignore:
      - autofix.yml
      - publish.yml
      - update.yml
  # Publish is intentionally chained off the weekly Update workflow.
  dangerous-triggers:
    ignore:
      - publish.yml
  # npm is bumped only for the Changesets publish job, not the repo lockfile.
  adhoc-packages:
    ignore:
      - publish.yml
