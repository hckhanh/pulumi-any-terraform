packages:
  - packages/*
  - docs
allowBuilds:
  '@swc/core': true
  esbuild: true
  nx: true
  protobufjs: true
  sharp: true
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  # Renovate security update: next@16.2.6 || 16.2.11
  - next@16.2.6 || 16.2.11
  - tmp@0.2.7
  - form-data@4.0.6
  - sharp@0.35.0
  - brace-expansion@5.0.9
overrides:
  # next (via docs) still resolves postcss@8.4.x without this; GHSA-qx2v-qp2m-jg93
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
  postcss@<8.5.10: '8.5.26'
  sharp@<0.35.0: ^0.35.0
auditConfig:
  # This moderate advisory is intentionally ignored: `pnpm audit --fix` would force
  # @opentelemetry/core 2.x into a 1.30.x OTel stack. nx telemetry is disabled
  # (analytics: false), so this path is never exercised.
  ignoreGhsas:
    # @opentelemetry/core: W3C trace-context DoS.
    - GHSA-8988-4f7v-96qf
