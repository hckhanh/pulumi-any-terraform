packages:
  - packages/*
autoDedupe: true
catalogPrune: true
allowBuilds:
  '@swc/core': true
  esbuild: true
  nx: true
  protobufjs: true
  sharp: true
minimumReleaseAge: 2880
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - tmp@0.2.7
  - form-data@4.0.6
overrides:
  axios@>=1.0.0 <1.20.0: ^1.20.0
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  # Pin postcss below 8.5.10; GHSA-qx2v-qp2m-jg93
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
  http-cache-semantics@<=4.2.0: ^4.3.0
  next@>=16.0.0 <16.3.3: ^16.3.3
  postcss@<8.5.10: '8.5.29'
  sharp@<0.35.0: ^0.35.0
  smol-toml@<=1.7.0: ^1.7.1
trustPolicyExcludePrune: true
auditConfig:
  # This moderate advisory is intentionally ignored: `pnpm audit --fix` would force
  # @opentelemetry/core 2.x into a 1.30.x OTel stack. nx telemetry is disabled
  # (analytics: false), so this path is never exercised.
  ignoreGhsas:
    # @opentelemetry/core: W3C trace-context DoS.
    - GHSA-8988-4f7v-96qf
