name: Setup Aikido Safe Chain
description: Download, SHA-256 verify, and install Aikido Safe Chain for CI
runs:
  using: composite
  steps:
    - name: Install Aikido Safe Chain
      shell: bash
      env:
        # The installer warns if SAFE_CHAIN_VERSION is set; pin via the download URL instead.
        SAFE_CHAIN_RELEASE: 1.5.15
        SAFE_CHAIN_SHA256: de0565e3d6346407a604e84e639e95fea8758748063da2216bbfdca5feda5dd2
      run: |
        curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/AikidoSec/safe-chain/releases/download/${SAFE_CHAIN_RELEASE}/install-safe-chain.sh" -o /tmp/install-safe-chain.sh
        echo "${SAFE_CHAIN_SHA256}  /tmp/install-safe-chain.sh" | sha256sum -c -
        sh /tmp/install-safe-chain.sh --ci
        rm /tmp/install-safe-chain.sh
