name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
  workflow_run:
    workflows: ['Update']
    types:
      - completed
    branches:
      - 'main'

env:
  NX_DAEMON: 'false'
  # Changesets v3 published 2026-08-11; under the 48h window until 2026-08-13 12:09 UTC
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS: '@changesets/*'

permissions:
  contents: read

jobs:
  npm-packages:
    name: NPM Packages
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Setup toolchains
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Setup cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Setup Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain
      - name: Install dependencies
        run: pnpm install
      - name: Update npm
        run: npm install -g npm@11.19.0
      - name: Publish to npm
        uses: changesets/action@22ccf9aa43179fe9e27dc62e575971d28cce197c # v2.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(release): release packages'
          pr-title: 'Release packages'
          publish-script: pnpm release
        env:
          SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: 0
