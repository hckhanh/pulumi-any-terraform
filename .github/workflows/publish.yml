name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
  workflow_run:
    workflows: ['Update']
    types:
      - completed
    branches:
      - 'main'

env:
  NX_DAEMON: 'false'

permissions:
  contents: read

jobs:
  npm-packages:
    name: NPM Packages
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 11.24.0
          runtime: node@24.20.0
          cache: true
      - name: Setup Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain
      - name: Update npm
        run: npm install --ignore-scripts -g npm@12.0.2
      - name: Publish to npm
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(release): release packages'
          pr-title: 'Release packages'
          publish-script: pnpm release
        env:
          SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: 0
