# This workflow is managed by gh actions-lock.

name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
  workflow_run:
    workflows: ['Update']
    types:
      - completed
    branches:
      - 'main'

env:
  NX_DAEMON: 'false'

permissions:
  contents: read

jobs:
  npm-packages:
    name: NPM Packages
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Setup pnpm
        uses: pnpm/setup@v2.0.2
        with:
          version: 11.22.0
          runtime: node@24.19.0
          cache: true
      - name: Setup Aikido Safe Chain
        uses: $/.github/actions/setup-safe-chain
      - name: Update npm
        run: npm install -g npm@11.19.0
      - name: Publish to npm
        uses: changesets/action@v2.1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(release): release packages'
          pr-title: 'Release packages'
          publish-script: pnpm release
        env:
          SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: 0
