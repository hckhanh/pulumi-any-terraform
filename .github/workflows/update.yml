# This workflow is managed by gh actions-lock.

name: Update

on:
  workflow_dispatch:
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

env:
  NX_DAEMON: 'false'

permissions:
  contents: read

jobs:
  check-updates:
    name: Check for Package Updates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
          # Required: this job runs `git push origin main`.
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/setup@v2.0.2
        with:
          version: 11.22.0
          runtime: node@24.19.0
          cache: true
      - name: Setup Aikido Safe Chain
        uses: $/.github/actions/setup-safe-chain
      - name: Setup Pulumi backend
        run: pulumi login --local
      - name: Check for updates
        id: check
        run: |
          node .github/scripts/check-updates.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix
        run: |
          pnpm nx run-many -t fix
          git add .
      - name: Update lockfile
        run: |
          pnpm install --no-frozen-lockfile
          git add .
      - name: Commit and push changes to main
        if: steps.check.outputs.has_updates == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(release): update packages to match upstream terraform providers"
            git push origin main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
