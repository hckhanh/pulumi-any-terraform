# This workflow is managed by gh actions-lock.

name: autofix.ci

on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:

env:
  NX_DAEMON: 'false'

permissions:
  contents: read

jobs:
  fix:
    name: Fix
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'renovate[bot]' && github.actor != 'autofix-ci[bot]' && ! contains(github.event.head_commit.author.name , 'renovate[bot]') && ! contains(github.event.head_commit.message , 'chore(release)') && ! contains(github.event.head_commit.message , '[autofix.ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
          # Required: autofix-ci/action pushes the formatted commit with this token.
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/setup@v2.0.2
        with:
          version: 11.22.0
          runtime: node@24.19.0
          cache: true
      - name: Setup Aikido Safe Chain
        uses: $/.github/actions/setup-safe-chain
      - name: Fix dependencies audit
        run: |
          pnpm audit --fix override
          pnpm install --no-frozen-lockfile
      - name: Set SHAs
        uses: nrwl/nx-set-shas@v5.0.1
      - name: Fix
        run: pnpm nx affected -t fix
      - name: Update lock file
        run: |
          pnpm install --no-frozen-lockfile
          pnpm update baseline-browser-mapping
          pnpm dedupe
      - name: Submit autofix
        uses: autofix-ci/action@v1.3.4
