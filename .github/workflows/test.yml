name: Test

on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:

env:
  NX_DAEMON: 'false'

permissions:
  contents: read

jobs:
  lint:
    name: Lint and Build
    runs-on: ubuntu-latest
    if: ${{ ! contains(github.event.head_commit.message , 'chore(release)') }}
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
          # Safe: this job never git-pushes. nx-set-shas only runs local git
          # (merge-base / rev-parse) and uses GITHUB_TOKEN for the GitHub API.
          persist-credentials: false
      - name: Setup toolchains
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          add_shims_to_path: false
          install_args: actionlint zizmor
        env:
          MISE_ENABLE_TOOLS: actionlint,zizmor
      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 12.3.0
          runtime: node@24.20.0
          cache: true
      - name: Setup Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain
      - name: Set SHAs
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
      - name: Check
        run: pnpm nx affected -t check
