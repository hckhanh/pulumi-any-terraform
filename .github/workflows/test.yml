# This workflow is managed by gh actions-lock.

name: Test

on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:

env:
  NX_DAEMON: 'false'

permissions:
  contents: read

jobs:
  lint:
    name: Lint and Build
    runs-on: ubuntu-latest
    if: ${{ ! contains(github.event.head_commit.message , 'chore(release)') }}
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
          # Safe: this job never git-pushes. nx-set-shas only runs local git
          # (merge-base / rev-parse) and uses GITHUB_TOKEN for the GitHub API.
          persist-credentials: false
      - name: Setup toolchains
        uses: jdx/mise-action@v4.2.5
        with:
          add_shims_to_path: false
          install_args: actionlint zizmor
        env:
          MISE_ENABLE_TOOLS: actionlint,zizmor
      - name: Setup pnpm
        uses: pnpm/setup@v2.0.2
        with:
          version: 11.22.0
          runtime: node@24.19.0
          cache: true
      - name: Setup Aikido Safe Chain
        uses: $/.github/actions/setup-safe-chain
      - name: Setup gh actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.1.6 --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set SHAs
        uses: nrwl/nx-set-shas@v5.0.1
      - name: Check
        run: pnpm nx affected -t check
        env:
          # gh actions-lock --verify (via root:actions-lock) resolves pins via the GitHub API.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
