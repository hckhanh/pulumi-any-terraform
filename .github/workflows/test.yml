name: Test

on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:

env:
  NX_DAEMON: 'false'

permissions:
  contents: read

jobs:
  lint:
    name: Lint and Build
    runs-on: ubuntu-latest
    if: ${{ ! contains(github.event.head_commit.message , 'chore(release)') }}
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
          # Safe: this job never git-pushes. nx-set-shas only runs local git
          # (merge-base / rev-parse) and uses GITHUB_TOKEN for the GitHub API.
          persist-credentials: false
      - name: Setup toolchains
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          add_shims_to_path: false
          install_args: actionlint zizmor
        env:
          MISE_ENABLE_TOOLS: actionlint,zizmor
      - name: Setup pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.20.0
          runtime: node@24.19.0
          cache: true
      - name: Setup Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain
      - name: Set SHAs
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
      - name: Check
        run: pnpm nx affected -t check
