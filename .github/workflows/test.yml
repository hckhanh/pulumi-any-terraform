name: Test

on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:

env:
  NX_DAEMON: 'false'

permissions:
  contents: read

jobs:
  lint:
    name: Lint and Build
    runs-on: ubuntu-latest
    if: ${{ ! contains(github.event.head_commit.message , 'chore(release)') }}
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
          # Safe: this job never git-pushes. nx-set-shas only runs local git
          # (merge-base / rev-parse) and uses GITHUB_TOKEN for the GitHub API.
          persist-credentials: false
      - name: Setup toolchains
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          add_shims_to_path: false
          install_args: actionlint zizmor
        env:
          MISE_ENABLE_TOOLS: actionlint,zizmor
      - name: Setup pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          version: 12.15.0
          runtime: node@24.22.1
          cache: true
      - name: Set SHAs
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
      - name: Check
        run: pnpm nx affected -t check
